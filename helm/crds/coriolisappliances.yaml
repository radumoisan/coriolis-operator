# Helm installs CRDs from this directory only on initial install. Apply this CRD
# separately before upgrading the chart whenever its schema changes.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: coriolisappliances.coriolis.cloudbase.it
  annotations:
    coriolis.cloudbase.it/upgrade-note: "Apply this CRD separately before chart upgrades; Helm does not upgrade CRDs in crds/."
spec:
  group: coriolis.cloudbase.it
  scope: Namespaced
  names:
    plural: coriolisappliances
    singular: coriolisappliance
    kind: CoriolisAppliance
    shortNames:
      - ca
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - version
              properties:
                version:
                  type: string
                  minLength: 1
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  minimum: 0
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - observedGeneration
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                        minLength: 1
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                        minLength: 1
                      message:
                        type: string
                        minLength: 1
      subresources:
        status: {}
