# Helm installs CRDs from this directory only on initial install. Apply this CRD
# separately before upgrading the chart whenever its schema changes.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: coriolisappliances.coriolis.cloudbase.it
  annotations:
    coriolis.cloudbase.it/upgrade-note: "Apply this CRD separately before chart upgrades; Helm does not upgrade CRDs in crds/."
spec:
  group: coriolis.cloudbase.it
  scope: Namespaced
  names:
    plural: coriolisappliances
    singular: coriolisappliance
    kind: CoriolisAppliance
    shortNames:
      - ca
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - version
              properties:
                profile:
                  type: string
                  enum:
                    - core
                  default: core
                version:
                  type: string
                  minLength: 1
                storage:
                  type: object
                  properties:
                    mariadb:
                      type: object
                      required:
                        - storageClassName
                        - size
                      properties:
                        storageClassName:
                          type: string
                          minLength: 1
                        size:
                          type: string
                          minLength: 1
                resources:
                  type: object
                  properties:
                    mariadb:
                      type: object
                      required:
                        - requests
                        - limits
                      properties:
                        requests:
                          type: object
                          required:
                            - cpu
                            - memory
                          properties:
                            cpu:
                              type: string
                              minLength: 1
                            memory:
                              type: string
                              minLength: 1
                        limits:
                          type: object
                          required:
                            - cpu
                            - memory
                          properties:
                            cpu:
                              type: string
                              minLength: 1
                            memory:
                              type: string
                              minLength: 1
                ingress:
                  type: object
                  default:
                    host: coriolis.app.cloudbase.wiki
                    ingressClassName: nginx
                    tls:
                      mode: certManager
                  properties:
                    host:
                      type: string
                      default: coriolis.app.cloudbase.wiki
                    ingressClassName:
                      type: string
                      default: nginx
                    tls:
                      type: object
                      default:
                        mode: certManager
                      properties:
                        mode:
                          type: string
                          enum:
                            - certManager
                            - existingSecret
                          default: certManager
                        clusterIssuer:
                          type: string
                        tlsSecretName:
                          type: string
            status:
              type: object
              properties:
                acceptedVersion:
                  type: string
                  minLength: 1
                observedGeneration:
                  type: integer
                  format: int64
                  minimum: 0
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - observedGeneration
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                        minLength: 1
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                        minLength: 1
                      message:
                        type: string
                        minLength: 1
      subresources:
        status: {}
