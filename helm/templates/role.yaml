apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "coriolis-operator.fullname" . }}
  labels:
    {{- include "coriolis-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - coriolis.cloudbase.it
    resources:
      - coriolisappliances
    verbs:
      - get
      - list
      - watch
      - patch
  - apiGroups:
      - coriolis.cloudbase.it
    resources:
      - coriolisappliances/status
    verbs:
      - get
      - patch
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - create
      - patch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
      - patch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
